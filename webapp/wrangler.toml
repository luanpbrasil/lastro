name = "lastro-live"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "node build.mjs"

[assets]
directory = "dist"

# Workers AI. `wrangler dev` also calls the real service, so local runs use your account's neurons.
[ai]
binding = "AI"

# Secret: TURNSTILE_SECRET comes from webapp/.dev.vars locally (never committed)
# and from `wrangler secret put TURNSTILE_SECRET` when deployed.

[vars]
# Different videos analysed per UTC day, all users together. Set to 0 to stop new analyses at once.
DAILY_VIDEO_CAP = "20"
# Different videos one connection can start per UTC day.
IP_DAILY_VIDEO_CAP = "3"
# Hard ceiling on Workers AI use per UTC day. Workers AI gives 10000 neurons a day for free; this stays under it with
# room for the measurement to be a little off. Lower it if anything else on the account uses Workers AI.
DAILY_NEURON_CAP = "9000"
# Listening time analysed per video. About 20 videos of 15 minutes fit in the neuron cap.
MAX_MINUTES_PER_VIDEO = "15"
# Listening sessions one connection can hold in 2 hours.
IP_SESSION_CAP = "6"
# Days to keep the transcript log (every upload's text and outcome; nothing about the sender).
LOG_RETENTION_DAYS = "30"
# Cloudflare's always-pass test key, which only works on localhost. Replace it before deploying.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

[[d1_databases]]
binding = "DB"
database_name = "lastro-live"
# Local dev uses a simulated database. Replace with the id from `wrangler d1 create lastro-live` before deploying.
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# Per connection, across all API routes. A page polls at most 15 times a minute.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
